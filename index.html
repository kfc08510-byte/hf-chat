<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HF Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="color:#6c5ce7">HF Chat</h2>
            <input type="password" id="pass-field" placeholder="أدخل الرمز الخاص">
            <button id="login-btn">دخول</button>
        </div>
    </div>
    <header>
        <div class="user-info">
            <b class="logo">HF Chat</b><br>
            <span id="p-dot" class="p-dot"></span> متصل الآن
        </div>
        <div class="top-actions">
            <button id="theme-btn" class="btn-svg">🌙</button>
        </div>
    </header>
    <div id="chat-flow"></div>
    <footer>
        <button id="img-trigger" class="btn-svg">🖼️</button>
        <button id="mic-control" class="btn-svg">🎤</button>
        <input type="text" id="main-input" placeholder="اكتب رسالة...">
        <button id="send-btn" class="btn-svg">🚀</button>
        <input type="file" id="file-hidden" hidden accept="image/*">
    </footer>
    <script src="script.js"></script>
</body>
</html>
